services:
  - type: web
    name: chronos-engine
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CHRONOS_BOOTSTRAP_DEV_USERS
        value: "true"
      - key: CHRONOS_OPS_PROJECTION_REBUILD_ENABLED
        value: "true"
      - key: SPRING_KAFKA_LISTENER_AUTO_STARTUP
        value: "false"
      - key: CHRONOS_JWT_SECRET
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: CHRONOS_CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: chronos-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://chronos-engine-4mci.onrender.com

