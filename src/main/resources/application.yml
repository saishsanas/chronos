spring:
  application:
    name: chronos-engine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chronos_test_db}
    username: ${SPRING_DATASOURCE_USERNAME:test_user}
    password: ${SPRING_DATASOURCE_PASSWORD:test_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  lifecycle:
    timeout-per-shutdown-phase: 20s

chronos:
  kafka:
    topic: ${CHRONOS_KAFKA_TOPIC:chronos.events.v1}
    consumer:
      group-id: ${CHRONOS_KAFKA_CONSUMER_GROUP:chronos-engine-v1}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      enabled: false
    kafka:
      enabled: false

logging:
  pattern:
    level: "%5p [chronos,corr=%X{correlationId}]"
  level:
    root: INFO
    com.chronos: INFO
